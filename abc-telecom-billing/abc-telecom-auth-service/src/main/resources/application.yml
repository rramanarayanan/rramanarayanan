spring:
  application:
    name: auth-service
  datasource:
    url: jdbc:postgresql://localhost:5432/abc_telecom_auth
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

server:
  port: 8081

jwt:
  secret: MySecretKeyForABCTelecomBillingSystemWithAtLeast256BitsOfRandomData
  expiration: 86400000

eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/
  instance:
    preferIpAddress: true

logging:
  level:
    root: INFO
    com.abctelecom: DEBUG
